name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node dependencies & build web bundle
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Setup Gradle (for root Android Gradle project)
        if: ${{ hashFiles('app/build.gradle.kts') != '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK (Native Android Gradle project)
        if: ${{ hashFiles('app/build.gradle.kts') != '' }}
        run: |
          gradle assembleDebug
          mkdir -p android/app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sync & Build Debug APK (Capacitor android/ fallback)
        if: ${{ hashFiles('app/build.gradle.kts') == '' }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload app-debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
